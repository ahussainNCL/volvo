name: Foundation validation
on: [push, pull_request]
permissions:
  contents: read
jobs:
  linux-foundation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: bash scripts/setup.sh
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: bash scripts/validate.sh
      - run: bash scripts/validate-cloud.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: foundation-results
          path: test-results/
  windows-dpapi-and-ipc:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - run: dotnet restore Nordlink.sln --locked-mode --configfile NuGet.Config
      - run: dotnet test tests/Nordlink.Tests --no-restore --logger "trx;LogFileName=windows.trx" --results-directory test-results
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-results
          path: test-results/
